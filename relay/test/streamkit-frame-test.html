<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>
    StreamKit Frame Test
  </title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 1rem;
    }

    input {
      width: 80%;
    }

    iframe {
      display: block;
      width: 1000px;
      height: 800px;
      margin-top: 1rem;
      border: 1px solid #888;
    }
  </style>
</head>

<body>
  <h1>
    StreamKit iframe test
  </h1>

  <input
    id="streamkit-url"
    type="text"
    placeholder="Paste the complete StreamKit Voice URL"
  >

  <button id="load">
    Load
  </button>

  <iframe
    id="streamkit-frame"
    allow="autoplay"
  ></iframe>

  <script>
    // #region Elements

    const urlInput =
      document.getElementById(
        "streamkit-url"
      );

    const frame =
      document.getElementById(
        "streamkit-frame"
      );

    // #endregion


    // #region Loading

    document
      .getElementById("load")
      .addEventListener(
        "click",
        () => {
          const value =
            urlInput.value.trim();

          if (!value) {
            return;
          }

          frame.src =
            value;
        }
      );

    // #endregion
  </script>
</body>
</html>
