<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>
    Max Headroom Mock StreamKit
  </title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      max-width: 1000px;
    }

    button {
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }

    fieldset {
      margin-bottom: 1rem;
    }

    pre {
      background: #111;
      color: #ddd;
      padding: 1rem;
      overflow: auto;
    }
  </style>
</head>

<body>
  <h1>
    Mock Discord StreamKit Relay
  </h1>

  <fieldset>
    <legend>
      Relay
    </legend>

    <button id="send-ready">
      Send Ready
    </button>

    <button id="send-heartbeat">
      Send Heartbeat
    </button>
  </fieldset>


  <fieldset>
    <legend>
      Alice
    </legend>

    <button id="alice-appear">
      Alice Appears
    </button>

    <button id="alice-start">
      Alice Starts Speaking
    </button>

    <button id="alice-duplicate">
      Duplicate Alice Start
    </button>

    <button id="alice-stop">
      Alice Stops Speaking
    </button>

    <button id="alice-mute">
      Alice Mute
    </button>

    <button id="alice-unmute">
      Alice Unmute
    </button>

    <button id="alice-deafen">
      Alice Deafen
    </button>

    <button id="alice-undeafen">
      Alice Undeafen
    </button>
  </fieldset>


  <fieldset>
    <legend>
      Bob / Other
    </legend>

    <button id="bob-start">
      Bob Starts Speaking
    </button>

    <button id="bob-stop">
      Bob Stops Speaking
    </button>

    <button id="unknown-start">
      Unknown User Speaks
    </button>

    <button id="malformed-event">
      Malformed Raw Event
    </button>
  </fieldset>


  <h2>
    Relay Runtime State
  </h2>

  <pre id="runtime-state"></pre>


  <script
    type="module"
    src="./mock-streamkit.js"
  ></script>
</body>
</html>
