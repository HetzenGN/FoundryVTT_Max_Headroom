<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>
    Max Headroom Mock Foundry Controller
  </title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      max-width: 1000px;
    }

    button {
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }

    pre {
      background: #111;
      color: #ddd;
      padding: 1rem;
      overflow: auto;
      min-height: 10rem;
    }

    .accepted {
      color: green;
    }

    .rejected {
      color: red;
    }
  </style>
</head>

<body>
  <h1>
    Max Headroom Mock Foundry Controller
  </h1>

  <p>
    Controller origin:
    <strong id="controller-origin"></strong>
  </p>

  <p>
    Expected relay origin:
    <strong id="relay-origin"></strong>
  </p>

  <p>
    Current nonce:
    <code id="nonce">none</code>
  </p>

  <button id="open-relay">
    Open Relay
  </button>

  <button id="open-bad-protocol">
    Open With Bad Protocol
  </button>

  <button id="close-relay">
    Close Relay
  </button>

  <button id="clear-log">
    Clear Log
  </button>

  <h2>
    Accepted Messages
  </h2>

  <pre
    id="accepted-log"
    class="accepted"
  ></pre>

  <h2>
    Rejected Messages
  </h2>

  <pre
    id="rejected-log"
    class="rejected"
  ></pre>

  <script
    type="module"
    src="./mock-controller.js"
  ></script>
</body>
</html>
